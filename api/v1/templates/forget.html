<!-- Password Reset 2 - Bootstrap Brain Component -->
<!DOCTYPE html>
<html lang="en-Us">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoolBooks</title>
    <link href="../static/styles/forget.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background-color: rgba(10, 10, 10, 0.867);">
    <div class="container-fluid">
        <div class="row align-items-center" id="space">
            <!-- social media section -->
            <div class="col-md-6 text-left" id="s-media">
                <div class="social-media">
                    <a href="#" class="social-icon"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="social-icon"><i class="fab fa-twitter"></i></a>
                    <a href="#" class="social-icon"><i class="fab fa-instagram"></i></a>
                    <a href="#" class="social-icon"><i class="fab fa-linkedin-in"></i></a>
                </div>
            </div>
            <!-- Auth section -->
            <div class="col-md-6 text-right" id="auth-l">
                <a href="signup.html" class="auth-link mr-1"><b>SIGN UP</b></a>
                <a href="#login" class="auth-link"><b>LOGIN</b></a>
            </div>
        </div>

        <div class="adjust">
            <!-- Logo Section -->
            <div class="row justify-content-center mt-5">
                <div class="col text-center">
                    <a href="landingpage.html"><img src="../static/images/logo.png" alt="Logo" class="logo"></a>
                </div>
            </div>

            <!-- Centering the card -->
            <div class="row justify-content-center mt-5 mb-3" id="for-card">
                <div class="col-md-4"> <!-- Adjust column width if needed -->
                    <div class="card text-center" style="background-color: rgba(45, 42, 44, 0.867); color: white;">
                        <div class="card-header h5 text-white" style="background-color: rgb(50, 205, 71);">Password
                            Reset
                        </div>
                        <div class="card-body px-5">
                            <p class="card-text py-2">
                                Enter your email address and we'll send you an email with instructions to reset your
                                password.
                            </p>
                            <div data-mdb-input-init class="form-outline">
                                <input type="email" id="email" class="form-control my-3"
                                    placeholder="Enter your email" />
                            </div>
                            <a href="#" data-mdb-ripple-init class="btn btn-primary w-100" id="reset-btn">Reset
                                password</a>
                            <div class="d-flex justify-content-between mt-4">
                                <a class="" href="login.html">Login</a>
                                <a class="" href="signup.html">Register</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/scripts/forget.js"></script>
</body>

</html>
