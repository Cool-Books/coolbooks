<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href='../static/styles/landing.css' rel="stylesheet">
    <link href="../static/styles/body.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>CoolBooks</title>
</head>

<body>
    <div class="container-fluid">
        <div class="s-auth">
            <!-- social media section -->
            <div class="s-media">
                <div class="social-media">
                    <a href="#" class="social-icon"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="social-icon"><i class="fab fa-twitter"></i></a>
                    <a href="#" class="social-icon"><i class="fab fa-instagram"></i></a>
                    <a href="#" class="social-icon"><i class="fab fa-linkedin-in"></i></a>
                </div>
            </div>
            <!-- Auth section -->
            <div class="auth">
                    <a href="http://localhost:5000/coolbooks/signup" class="auth-link mr-1"><b>SIGN UP</b></a>
                    <a href="http://localhost:5000/coolbooks/login" class="auth-link"><b>LOGIN</b></a>
            </div>
        </div>

        <!-- Logo Section -->
        <div class="row justify-content-center mt-5">
            <div class="col text-center">
                <a href="http://localhost:5000/coolbooks/"><img src="../static/images/logo.png" alt="Logo"
                        class="logo"></a>
            </div>
        </div>
        <!-- Books section -->
        <div class="row justify-content-center mt-3">
            <div class="col-md-12 text-center">
                <h1 class="books-heading"><b>BOOKS</b></h1>
            </div>
            <div id="books-list" class="books-list"></div>
            <div class="row justify-content-center mt-3 genre-section">
                <div class="genre" id="fantansy">
                    <a href="#"><img src="../static/images/fantasy.svg" alt="fantansy" class="genre-icon"></a>
                    <p><b>FANTANSY</b></p>
                </div>
                <div class="genre" id="romance">
                    <a href="#"><img src="../static/images/romance2.svg" alt="romance" class="genre-icon"></a>
                    <p><b>ROMANCE</b></p>
                </div>
                <div class="genre" id="best">
                    <a href="#"><img src="../static/images/bestsellers.svg" alt="bestsellers" class="genre-icon"></a>
                    <p><b>BEST SELLER</b></p>
                </div>
                <div class="genre" id="scifi">
                    <a href="#"><img src="../static/images/scifi.svg" alt="scifi" class="genre-icon"></a>
                    <p><b>SCI-FI</b></p>
                </div>
                <div class="genre" id="fict">
                    <a href="#"><img src="../static/images/nonfiction.svg" alt="nonfiction" class="genre-icon"></a>
                    <p><b>NON FICTION</b></p>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/scripts/landing.js"></script>
</body>

</html>
