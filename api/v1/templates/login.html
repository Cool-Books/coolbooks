<!DOCTYPE html>
<html lang="en-Us">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoolBooks</title>
    <link rel="stylesheet" href="/coolbooks/static/styles/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background-color: rgba(10, 10, 10, 0.867);">
    <div class="container-fluid">
        <div class="social-auth">
            <!-- social media section -->
            <div class="left">
                <div class="social-media">
                    <a href="#" class="social-icon"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="social-icon"><i class="fab fa-twitter"></i></a>
                    <a href="#" class="social-icon"><i class="fab fa-instagram"></i></a>
                    <a href="#" class="social-icon"><i class="fab fa-linkedin-in"></i></a>
                </div>
            </div>
            <!-- Auth section -->
            <div class="right">
                <a href="http://localhost:5000/coolbooks/signup" class="auth-link"><b>SIGN UP</b></a>
                <a href="http://localhost:5000/coolbooks/login" class="auth-link"><b>LOGIN</b></a>
            </div>
        </div>

        <!-- Logo Section -->
        <div class="row justify-content-center mt-4">
            <a href="/coolbooks/login/">
                <img src="/coolbooks/static/images/logo.png" alt="Logo" class="logo">
            </a>
        </div>
    </div>
    <section>
        <div class="container py-5 h-100">
            <div class="row d-flex justify-content-center align-items-center h-100">
                <div class="col col-xl-10">
                    <div class="card" style="border-radius: 1rem; background-color: rgba(10, 10, 10, 0.867);">
                        <div class="row g-0">
                            <div class="col-md-6 col-lg-5 d-none d-md-block">
                                <img src="../static/images/read.png" alt="e-library" class="img-fluid"
                                    style="border-radius: 1rem 0 0 1rem; margin-top: 0;" />
                            </div>
                            <div class="col-md-6 col-lg-7 d-flex align-items-center">
                                <div class="card-body p-4 p-lg-5 text-black">

                                    <form>
                                        <h5 class="fw-normal mb-3 pb-3" style="letter-spacing: 1px; color: white;">
                                            Sign into your account
                                        </h5>

                                        <div data-mdb-input-init class="form-outline mb-4">
                                            <input type="email" id="email" placeholder="Enter your email"
                                                style="background-color: rgba(34, 32, 32, 0.867);"
                                                class="form-control form-control-lg" required />
                                            <label class="form-label" style="color: white;" for="form2Example17">Email
                                                address</label>
                                        </div>

                                        <div data-mdb-input-init class="form-outline mb-4">
                                            <input type="password" id="pwd"
                                                style="background-color: rgba(34, 32, 32, 0.867);"
                                                placeholder="Enter your password" class="form-control form-control-lg"
                                                required />
                                            <label class="form-label" for="form2Example27"
                                                style="color: white;">Password</label>
                                        </div>

                                        <div class="pt-1 mb-4">
                                            <button data-mdb-button-init data-mdb-ripple-init
                                                class="btn btn-dark btn-lg btn-block" id="log-in"
                                                type="button">Login</button>
                                        </div>

                                        <a class="small " href="http://localhost:5000/coolbooks/forgot_pwd">Forgot
                                            password?</a>
                                        <p class="mb-5 pb-lg-2" style="color: #9197d7;">Don't have an account? <a
                                                href="http://localhost:5000/coolbooks/signup"
                                                style="color: #bcc0e9;">Register here</a></p>
                                        <a href="#!" class="small text-muted">Terms of use.</a>
                                        <a href="#!" class="small text-muted">Privacy policy</a>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/scripts/login.js"></script>
</body>

</html>
